name: Atualizar estatísticas do perfil

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Gerar estatísticas com GitHub Readme Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Felypeulian&show_icons=true&theme=github_dark&locale=pt-br&rank_icon=github&card_width=420
          path: assets/github-stats.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Gerar linguagens com GitHub Readme Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Felypeulian&layout=compact&theme=github_dark&locale=pt-br&langs_count=6&card_width=420&exclude_repo=Felypeulian&hide=Hack
          path: assets/top-languages.svg
          token: ${{ github.token }}
          fail_on_error: 'true'
      - name: Validar imagens geradas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for path in Path("assets").glob("*.svg"):
              svg = path.read_text()
              ElementTree.fromstring(svg)
              if "Something went wrong" in svg:
                  raise SystemExit(f"Falha ao gerar {path}")
          PY
      - name: Salvar cartões atualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: atualiza cartões GitHub Readme Stats'
          git pull --rebase origin main
          git push
