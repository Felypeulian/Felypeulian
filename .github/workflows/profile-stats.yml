name: Atualizar estatísticas do perfil

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verificar gerador
        run: python3 scripts/update_stats.py --test
      - name: Gerar cartões
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Salvar imagens atualizadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/*.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: atualiza estatísticas do perfil'
          git pull --rebase origin main
          git push
